<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulseGCS M3 — Client UI/UX Studio (US01 & US02)</title>
<style>
  :root {
    /* Exact M2 Indoor Dark Tokens (from PulseGCSTokens.qml) */
    --indoor-ink: #0A1420;
    --indoor-surface-panel: #112537;
    --indoor-surface-elevated: #16324A;
    --indoor-surface-toolbar: #0D1B2A;
    --indoor-text-primary: #EAF4FB;
    --indoor-text-muted: #9FB7CC;
    --indoor-text-meta: #6E869D;
    --indoor-accent: #2FD0E8;
    --indoor-accent-hover: #5BDCF0;
    --indoor-accent-core: #00C4DE;
    --indoor-card-tint: rgba(47, 208, 232, 0.08);
    --indoor-border-subtle: rgba(140, 163, 184, 0.16);
    --indoor-button-surface: #16283A;
    --indoor-err: #F0684F;
    --indoor-err-bg: rgba(240, 104, 79, 0.14);
    --indoor-ok: #3ED598;
    --indoor-ok-bg: rgba(62, 213, 152, 0.14);
    --indoor-warn: #F2B84B;
    --indoor-warn-bg: rgba(242, 184, 75, 0.14);

    /* Exact M2 Outdoor Light Tokens (from PulseGCSTokens.qml) */
    --outdoor-window: #FFFFFF;
    --outdoor-window-shade: #EDF2F6;
    --outdoor-window-shade-light: #F6F9FB;
    --outdoor-window-shade-dark: #DCE5EC;
    --outdoor-text-primary: #14202B;
    --outdoor-text-muted: #4C6072;
    --outdoor-text-meta: #748899;
    --outdoor-accent: #0092A8;
    --outdoor-accent-hover: #00B2CC;
    --outdoor-accent-core: #00788A;
    --outdoor-card-tint: rgba(0, 146, 168, 0.07);
    --outdoor-border-subtle: #DCE5EC;
    --outdoor-button-surface: #FFFFFF;
    --outdoor-err: #C13A24;
    --outdoor-err-bg: rgba(193, 58, 36, 0.10);
    --outdoor-ok: #178A57;
    --outdoor-ok-bg: rgba(23, 138, 87, 0.11);
    --outdoor-warn: #97650B;
    --outdoor-warn-bg: rgba(151, 101, 11, 0.11);

    /* M2 Geometries */
    --radius-card: 10px;
    --radius-control: 8px;
    --radius-button: 7px;
    --radius-pill: 999px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Space Grotesk", sans-serif; }
  
  body {
    background: #060D15;
    color: #eaf4fb;
    padding: 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header & Studio Navigation Bar */
  .studio-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 14px;
  }
  .studio-title {
    font-size: 17px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: 0.2px;
  }
  .tag-badge {
    background: #2FD0E8;
    color: #0A1420;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10.5px;
    font-weight: 700;
  }

  /* Controls Navigation Bar */
  .studio-nav {
    display: flex;
    gap: 12px;
    background: #0d1a29;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 16px;
    align-items: center;
    flex-wrap: wrap;
    border: 1px solid rgba(140, 163, 184, 0.15);
  }
  .nav-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-label {
    font-size: 11.5px;
    font-weight: 600;
    color: #9fb7cc;
  }
  
  button.screen-pill {
    background: #16283a;
    color: #eaf4fb;
    border: 1px solid rgba(140, 163, 184, 0.25);
    padding: 6px 13px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button.screen-pill:hover {
    border-color: #2FD0E8;
  }
  button.screen-pill.active {
    background: #2FD0E8;
    color: #0A1420;
    font-weight: 700;
    border-color: #2FD0E8;
    box-shadow: 0 0 12px rgba(47, 208, 232, 0.4);
  }

  button.tool-btn {
    background: #16283a;
    color: #eaf4fb;
    border: 1px solid rgba(140, 163, 184, 0.25);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 11.5px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button.tool-btn:hover { border-color: #2FD0E8; }
  button.tool-btn.active {
    background: #16324A;
    border-color: #2FD0E8;
    color: #2FD0E8;
  }

  /* Stage & Viewport */
  .stage-container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    flex: 1;
    gap: 18px;
  }

  /* Authentic Screen Viewport (Strictly Clean - Zero Developer Controls) */
  .screen-viewport {
    position: relative;
    width: 960px;
    height: 560px;
    border-radius: 12px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.65);
    border: 1px solid rgba(255,255,255,0.12);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: all 0.25s ease;
    flex-shrink: 0;
  }
  .screen-viewport.wide-mode {
    width: 1040px;
    height: 580px;
  }
  .screen-viewport.portrait-mode {
    width: 460px;
    height: 740px;
  }

  /* Theme Applied Rules */
  .theme-dark {
    background-color: var(--indoor-ink);
    color: var(--indoor-text-primary);
  }
  .theme-light {
    background-color: var(--outdoor-window);
    color: var(--outdoor-text-primary);
  }

  /* PulseGCS Panel Top Navigation Header (Removed across all panels for clean card layout) */
  .panel-top-header {
    display: none !important;
  }
  .theme-dark .panel-top-header {
    background: transparent;
    border-bottom: none;
  }
  .theme-light .panel-top-header {
    background: transparent;
    border-bottom: none;
  }

  .header-left-cluster {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-logo-icon {
    width: 22px;
    height: 22px;
    display: block;
  }
  .header-panel-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .theme-dark .header-panel-title { color: var(--indoor-text-primary); }
  .theme-light .header-panel-title { color: var(--outdoor-text-primary); }

  .header-panel-sub {
    font-size: 12px;
    font-weight: 500;
    opacity: 0.65;
    margin-left: 4px;
  }

  .header-right-cluster {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Clickable Action Button (Matching ConnectAircraftPanel scanBtn / exitBtn) */
  .header-demo-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 32px;
    padding: 0 16px;
    border-radius: var(--radius-button); /* 7px matching PulseGCSTokens */
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.2px;
    border: 1px solid;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .theme-light .header-demo-btn {
    background: var(--outdoor-button-surface); /* Plain white #FFFFFF */
    border-color: #B0C0CE; /* Clean dark/slate border */
    color: var(--outdoor-text-primary); /* #14202B dark text, no blue */
  }
  .theme-light .header-demo-btn:hover {
    background: var(--outdoor-window-shade-light); /* #F6F9FB */
    border-color: #8C9EAE;
  }
  .theme-light .header-demo-btn:active {
    background: var(--outdoor-window-shade-dark); /* #DCE5EC */
  }
  .theme-dark .header-demo-btn {
    background: var(--indoor-button-surface); /* #16283A */
    border-color: rgba(140, 163, 184, 0.22);
    color: var(--indoor-text-primary); /* #EAF4FB */
  }
  .theme-dark .header-demo-btn:hover {
    background: var(--indoor-surface-elevated); /* #16324A */
    border-color: rgba(140, 163, 184, 0.4);
  }
  .theme-dark .header-demo-btn:active {
    background: #1C3E5E;
  }

  /* Body Container */
  .panel-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 20px;
    position: relative;
    overflow-y: auto;
  }

  /* ========================================================================= */
  /* POP-UP NOTIFICATION BANNER (Top Floating — Zero Truncation, High Usability) */
  /* ========================================================================= */
  .floating-notice-anchor {
    position: absolute;
    top: 56px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    z-index: 100;
    pointer-events: none;
    padding: 0 16px;
  }
  .gcs-floating-popup {
    pointer-events: auto;
    width: 600px;
    max-width: 95%;
    border-radius: 8px;
    border-width: 1px;
    border-style: solid;
    padding: 11px 16px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.55);
    backdrop-filter: blur(10px);
    animation: popSlideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    transition: all 0.2s ease;
  }
  @keyframes popSlideDown {
    0% { transform: translateY(-14px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .theme-dark .popup-err {
    background: rgba(28, 16, 20, 0.95);
    border-color: var(--indoor-err);
    box-shadow: 0 16px 40px rgba(0,0,0,0.65), 0 0 16px rgba(240, 104, 79, 0.25);
  }
  .theme-dark .popup-warn {
    background: rgba(28, 22, 14, 0.95);
    border-color: var(--indoor-warn);
    box-shadow: 0 16px 40px rgba(0,0,0,0.65), 0 0 16px rgba(242, 184, 75, 0.25);
  }
  .theme-dark .popup-info {
    background: rgba(14, 28, 40, 0.95);
    border-color: var(--indoor-accent);
    box-shadow: 0 16px 40px rgba(0,0,0,0.65), 0 0 16px rgba(47, 208, 232, 0.25);
  }
  .theme-dark .popup-ok {
    background: rgba(14, 30, 24, 0.95);
    border-color: var(--indoor-ok);
    box-shadow: 0 16px 40px rgba(0,0,0,0.65), 0 0 16px rgba(62, 213, 152, 0.25);
  }

  .theme-light .popup-err {
    background: rgba(255, 246, 245, 0.97);
    border-color: var(--outdoor-err);
    box-shadow: 0 12px 32px rgba(0,0,0,0.12), 0 0 12px rgba(193, 58, 36, 0.15);
  }
  .theme-light .popup-warn {
    background: rgba(255, 251, 242, 0.97);
    border-color: var(--outdoor-warn);
    box-shadow: 0 12px 32px rgba(0,0,0,0.12), 0 0 12px rgba(151, 101, 11, 0.15);
  }
  .theme-light .popup-info {
    background: rgba(242, 251, 254, 0.97);
    border-color: var(--outdoor-accent);
    box-shadow: 0 12px 32px rgba(0,0,0,0.12), 0 0 12px rgba(0, 146, 168, 0.15);
  }
  .theme-light .popup-ok {
    background: rgba(242, 254, 248, 0.97);
    border-color: var(--outdoor-ok);
    box-shadow: 0 12px 32px rgba(0,0,0,0.12), 0 0 12px rgba(23, 138, 87, 0.15);
  }

  .popup-icon-badge {
    font-size: 16px;
    line-height: 1;
    margin-top: 1px;
    flex-shrink: 0;
  }
  .popup-content-block {
    flex: 1;
  }
  .popup-title {
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 3px;
  }
  .theme-dark .popup-err .popup-title { color: var(--indoor-err); }
  .theme-dark .popup-warn .popup-title { color: var(--indoor-warn); }
  .theme-dark .popup-info .popup-title { color: var(--indoor-accent); }
  .theme-dark .popup-ok .popup-title { color: var(--indoor-ok); }

  .theme-light .popup-err .popup-title { color: var(--outdoor-err); }
  .theme-light .popup-warn .popup-title { color: var(--outdoor-warn); }
  .theme-light .popup-info .popup-title { color: var(--outdoor-accent); }
  .theme-light .popup-ok .popup-title { color: var(--outdoor-ok); }

  .popup-message-body {
    font-size: 11.5px;
    line-height: 1.4;
    word-break: break-word;
    opacity: 0.92;
  }
  .theme-dark .popup-message-body { color: var(--indoor-text-primary); }
  .theme-light .popup-message-body { color: var(--outdoor-text-primary); }

  .popup-actions-block {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .popup-action-btn {
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    background: transparent;
    border: 1px solid;
    transition: all 0.15s ease;
  }
  .theme-dark .popup-err .popup-action-btn { color: var(--indoor-err); border-color: var(--indoor-err); }
  .theme-dark .popup-warn .popup-action-btn { color: var(--indoor-warn); border-color: var(--indoor-warn); }
  .theme-dark .popup-info .popup-action-btn { color: var(--indoor-accent); border-color: var(--indoor-accent); }
  .theme-dark .popup-ok .popup-action-btn { color: var(--indoor-ok); border-color: var(--indoor-ok); }

  .theme-light .popup-err .popup-action-btn { color: var(--outdoor-err); border-color: var(--outdoor-err); }
  .theme-light .popup-warn .popup-action-btn { color: var(--outdoor-warn); border-color: var(--outdoor-warn); }
  .theme-light .popup-info .popup-action-btn { color: var(--outdoor-accent); border-color: var(--outdoor-accent); }
  .theme-light .popup-ok .popup-action-btn { color: var(--outdoor-ok); border-color: var(--outdoor-ok); }

  .popup-close-btn {
    background: none;
    border: none;
    color: inherit;
    opacity: 0.6;
    font-size: 15px;
    cursor: pointer;
    padding: 2px 4px;
    line-height: 1;
    transition: opacity 0.15s;
  }
  .popup-close-btn:hover { opacity: 1; }

  /* ========================================================================= */
  /* PulseGCS In-Card Notice Bar Component (Expanded Auto-Height, No Ellipsis) */
  /* ========================================================================= */
  .pulsegcs-notice-bar {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    min-height: 38px;
    padding: 9px 12px;
    border-radius: 6px;
    border-width: 1px;
    border-style: solid;
    font-size: 11.5px;
    box-sizing: border-box;
    margin-bottom: 14px;
    width: 100%;
    transition: all 0.2s ease;
  }
  .theme-dark .notice-bar-info { background: var(--indoor-card-tint); border-color: var(--indoor-accent); }
  .theme-dark .notice-bar-info .notice-bar-icon { color: var(--indoor-accent); }
  .theme-dark .notice-bar-warn { background: var(--indoor-warn-bg); border-color: var(--indoor-warn); }
  .theme-dark .notice-bar-warn .notice-bar-icon { color: var(--indoor-warn); }
  .theme-dark .notice-bar-err { background: var(--indoor-err-bg); border-color: var(--indoor-err); }
  .theme-dark .notice-bar-err .notice-bar-icon { color: var(--indoor-err); }
  .theme-dark .notice-bar-ok { background: var(--indoor-ok-bg); border-color: var(--indoor-ok); }
  .theme-dark .notice-bar-ok .notice-bar-icon { color: var(--indoor-ok); }

  .theme-light .notice-bar-info { background: var(--outdoor-card-tint); border-color: var(--outdoor-accent); }
  .theme-light .notice-bar-info .notice-bar-icon { color: var(--outdoor-accent); }
  .theme-light .notice-bar-warn { background: var(--outdoor-warn-bg); border-color: var(--outdoor-warn); }
  .theme-light .notice-bar-warn .notice-bar-icon { color: var(--outdoor-warn); }
  .theme-light .notice-bar-err { background: var(--outdoor-err-bg); border-color: var(--outdoor-err); }
  .theme-light .notice-bar-err .notice-bar-icon { color: var(--outdoor-err); }
  .theme-light .notice-bar-ok { background: var(--outdoor-ok-bg); border-color: var(--outdoor-ok); }
  .theme-light .notice-bar-ok .notice-bar-icon { color: var(--outdoor-ok); }

  .notice-bar-icon {
    font-size: 14px;
    font-weight: 700;
    line-height: 1.2;
    flex-shrink: 0;
  }
  .notice-bar-message {
    font-size: 11.5px;
    font-weight: 600;
    line-height: 1.4;
    flex: 1;
    white-space: normal;
    word-break: break-word;
  }
  .theme-dark .notice-bar-message { color: var(--indoor-text-primary); }
  .theme-light .notice-bar-message { color: var(--outdoor-text-primary); }

  .notice-bar-action-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    flex-shrink: 0;
    border: 1px solid currentColor;
    margin-top: 1px;
  }
  .theme-dark .notice-bar-info .notice-bar-action-btn { color: var(--indoor-accent); }
  .theme-dark .notice-bar-warn .notice-bar-action-btn { color: var(--indoor-warn); }
  .theme-dark .notice-bar-err .notice-bar-action-btn { color: var(--indoor-err); }
  .theme-dark .notice-bar-ok .notice-bar-action-btn { color: var(--indoor-ok); }

  .theme-light .notice-bar-info .notice-bar-action-btn { color: var(--outdoor-accent); }
  .theme-light .notice-bar-warn .notice-bar-action-btn { color: var(--outdoor-warn); }
  .theme-light .notice-bar-err .notice-bar-action-btn { color: var(--outdoor-err); }
  .theme-light .notice-bar-ok .notice-bar-action-btn { color: var(--outdoor-ok); }

  /* PulseGCS Cards */
  .gcs-card {
    width: 100%;
    margin: auto 0;
    border-radius: var(--radius-card);
    transition: all 0.2s ease;
  }
  .gcs-card.signin-card {
    max-width: 440px;
    padding: 26px 28px 22px 28px;
  }
  /* Sequential Step Registration Cards (Focused, single section) */
  .gcs-card.step1-card {
    max-width: 480px;
    padding: 22px 28px;
  }
  .gcs-card.step2-card {
    max-width: 530px;
    padding: 20px 28px;
  }
  .gcs-card.pending-card {
    max-width: 750px;
    padding: 18px 22px;
  }

  .theme-dark .gcs-card {
    background: var(--indoor-surface-panel);
    border: 1px solid var(--indoor-border-subtle);
    box-shadow: 0 16px 36px rgba(0,0,0,0.35);
  }
  .theme-light .gcs-card {
    background: var(--outdoor-window-shade);
    border: 1px solid var(--outdoor-border-subtle);
    box-shadow: 0 10px 28px rgba(0,0,0,0.06);
  }

  /* Brand Lockup */
  .brand-lockup {
    text-align: center;
    margin-bottom: 18px;
  }
  .logo-svg {
    width: 44px;
    height: 44px;
    margin: 0 auto 6px auto;
    display: block;
  }
  .app-name {
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.8px;
  }
  .app-subtitle {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.4px;
    margin-top: 3px;
  }
  .theme-dark .app-subtitle { color: var(--indoor-text-muted); }
  .theme-light .app-subtitle { color: var(--outdoor-text-muted); }

  /* ========================================================================= */
  /* Step Wizard Progress Bar                                                  */
  /* ========================================================================= */
  .step-progress-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(140, 163, 184, 0.16);
  }
  .step-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    font-weight: 600;
    color: #9FB7CC;
    cursor: pointer;
  }
  .step-item.active {
    color: var(--indoor-accent);
    font-weight: 700;
  }
  .theme-light .step-item.active {
    color: var(--outdoor-accent);
  }
  .step-item.completed {
    color: var(--indoor-ok);
  }
  .theme-light .step-item.completed {
    color: var(--outdoor-ok);
  }

  .step-number-circle {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    border: 1.5px solid rgba(140, 163, 184, 0.35);
  }
  .step-item.active .step-number-circle {
    border-color: var(--indoor-accent);
    background: rgba(47, 208, 232, 0.16);
    color: var(--indoor-accent);
  }
  .theme-light .step-item.active .step-number-circle {
    border-color: var(--outdoor-accent);
    background: rgba(0, 146, 168, 0.12);
    color: var(--outdoor-accent);
  }
  .step-item.completed .step-number-circle {
    border-color: var(--indoor-ok);
    background: rgba(62, 213, 152, 0.16);
    color: var(--indoor-ok);
  }
  .theme-light .step-item.completed .step-number-circle {
    border-color: var(--outdoor-ok);
    background: rgba(23, 138, 87, 0.12);
    color: var(--outdoor-ok);
  }

  .step-connector-line {
    width: 48px;
    height: 2px;
    background: rgba(140, 163, 184, 0.2);
    margin: 0 12px;
  }
  .step-connector-line.completed {
    background: var(--indoor-ok);
  }
  .theme-light .step-connector-line.completed {
    background: var(--outdoor-ok);
  }

  /* Input Fields */
  .form-group {
    margin-bottom: 12px;
    text-align: left;
  }
  .form-label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
    font-weight: 600;

    return `

        <span class="notice-bar-message">${message}</span>
        ${actionButton}

  // Step 1 Validation & Proceed
  function validateAndGoToStep2() {
    saveCurrentInputs();

    let invalidFields = [];
    if (!regFormData.fullName.trim()) invalidFields.push({ id: 'regFullName', msg: 'Full name is required' });
    if (!regFormData.phone.trim()) invalidFields.push({ id: 'regPhone', msg: 'Phone number is required' });
    if (!regFormData.email.trim() || !regFormData.email.includes('@')) invalidFields.push({ id: 'regEmail', msg: 'Valid email address is required' });
    if (!regFormData.pw || regFormData.pw.length < 8) invalidFields.push({ id: 'regPw', msg: 'Password must be at least 8 characters' });
    if (!regFormData.dob) invalidFields.push({ id: 'regDOB', msg: 'Date of birth is required' });

    // Reset visual error states
    ['regFullName', 'regPhone', 'regEmail', 'regPw', 'regDOB'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.classList.remove('input-invalid');
    });

    if (invalidFields.length > 0) {
      // Highlight first error field
      const first = invalidFields[0];
      const el = document.getElementById(first.id);
      if (el) {
        el.classList.add('input-invalid');
        el.focus();
      }

      const summary = (invalidFields.length === 1) 
        ? first.msg 
        : `${first.msg} (and ${invalidFields.length - 1} other field incomplete)`;

      if (notificationFormat === 'popup') {
        renderFloatingPopNotification('err', 'Operator Information Required', summary);
      } else if (notificationFormat === 'modal') {
        renderNotificationModal('err', 'Operator Information Required', summary, 'Review Form', 'dismissNotificationModal()');
      } else {
        const noticeEl = document.getElementById('step1InlineNotice');
        if (noticeEl) {
          noticeEl.innerHTML = renderPulseGCSNoticeBar('err', summary);
        }
      }
      return;
    }

    // Success: advance to Step 2
    dismissPopup();
    dismissNotificationModal();
    loadScreen('us02_step2');
  }

  function validateAndSubmitRegistration() {
    saveCurrentInputs();

    const ds = document.getElementById('regDroneSerial');
    const card = document.getElementById('consoleBindingCard');

    if (ds) ds.classList.remove('input-invalid');
    if (card) card.classList.remove('input-invalid');

    if (!regFormData.serial.trim()) {
      if (ds) {
        ds.classList.add('input-invalid');
        ds.focus();
      }
      const msg = 'Visible drone serial number is required to link physical hardware.';
      if (notificationFormat === 'popup') {
        renderFloatingPopNotification('err', 'Airframe Serial Required', msg);
      } else if (notificationFormat === 'modal') {
        renderNotificationModal('err', 'Airframe Serial Required', msg, 'Enter Serial', 'dismissNotificationModal()');
      } else {
        const noticeEl = document.getElementById('step2InlineNotice');
        if (noticeEl) noticeEl.innerHTML = renderPulseGCSNoticeBar('err', msg);
      }
      return;
    }

    if (!regFormData.bindConfirm) {
      if (card) card.classList.add('input-invalid');
      const msg = 'Please enable console hardware binding to link this tablet to your aircraft license.';
      if (notificationFormat === 'popup') {
        renderFloatingPopNotification('warn', 'Console Attestation Required', msg);
      } else if (notificationFormat === 'modal') {
        renderNotificationModal('warn', 'Console Attestation Required', msg, 'Enable Binding', 'dismissNotificationModal()');
      } else {
        const noticeEl = document.getElementById('step2InlineNotice');
        if (noticeEl) noticeEl.innerHTML = renderPulseGCSNoticeBar('warn', msg);
      }
      return;
    }

    // Success: show clean "Application Sent to SkyX Backend" popup
    dismissPopup();
    dismissNotificationModal();
    showApplicationSentPopup();
  }

  // Active Sign-In Alert Details (Direct notification on Sign In screen)
  function getSigninAlertData() {
    if (us01NoticeState === 'err_creds') {
      return {
        type: 'err',
        title: 'Sign In Failed',
        message: 'Invalid user account or password. Please verify your credentials or use password recovery.',
        actionText: 'Retry',
        actionCallback: "setUS01State('normal')"
      };
    }
    if (us01NoticeState === 'err_device') {
      return {
        type: 'warn',
        title: 'Console Not Authorized',
        message: 'Your user account is valid, but this console is not authorized for flight operations. Contact your administrator to enroll or reassign this device.',
        actionText: 'Details',
        actionCallback: "alert('Console Not Authorized: Contact SkyX Support to bind or reassign this device to your operator account.')"
      };
    }
    if (us01NoticeState === 'err_suspended') {
      return {
        type: 'err',
        title: 'Console Suspended',
        message: 'This console has been marked replaced or suspended by an administrator. Please sign in using an authorized device or contact SkyX support.',
        actionText: 'Help',

      };
    }
    if (us01NoticeState === 'err_network') {
      return {
        type: 'err',
        title: 'Server Connection Timeout',
        message: 'Unable to reach SkyX authentication servers. Please verify your internet connection and try again.',
        actionText: 'Retry',
        actionCallback: "setUS01State('normal')"
      };
    }
    if (us01NoticeState === 'ok_session') {
      return {
        type: 'ok',
        title: 'Session Authenticated',
        message: 'Cryptographic identity verified. Your 7-day offline flight authorization is active on this console.',
        actionText: 'Dismiss',
        actionCallback: "setUS01State('normal')"
      };
    }
    return null;
  }

      return {
        type: 'err',
        title: 'FCM Verification Failure',
        message: 'Aircraft Flight Control Module (FCM UID: 1A:2B:3C:4D:5E:6F) does not match registered airframe serial (SKYX-KSN-2026-0842). Telemetry connection aborted.',
        actionText: 'Retry Connection',

      };
    }
    if (fcmAlertState === 'unregistered') {
      return {
        type: 'warn',
        title: 'Unregistered Hardware Silicon',
        message: 'FCM UID (3C:4D:5E:6F:7A:8B) is not recognized in the SkyX registry for airframe SKYX-KSN-2026-0842. Flight telemetry restricted to observation.',
        actionText: 'Review Fleet',
        actionCallback: "alert('Unregistered FCM: Verify airframe binding in SkyX Fleet Console.')"
      };

      return {
        type: 'ok',
        title: 'FCM Silicon Verified',

    recoveryStage = 'request';

    recoveryStage = stage;

    recoveryNoticeState = st;
    document.getElementById('screenBody').innerHTML = screens.us03_recovery();
    updateNotificationDisplay();
    renderControllerPanel();
  }

  function submitRecoveryEmail() {
    const input = document.getElementById('recoveryEmailInput');
    if (input && input.value.trim()) {
      recoveryEmail = input.value.trim();
    }
    recoveryStage = 'code';
    recoveryNoticeState = 'ok_sent';
    loadScreen('us03_recovery');
  }

  function verifyRecoveryCode() {
    const codeInput = document.getElementById('recoveryCode');
    const code = codeInput ? codeInput.value.trim() : '';
    
    // Explicit verification check: if code is not 849201, trigger failure!
    if (code !== '849201') {
      if (codeInput) {
        codeInput.classList.add('input-invalid');
        codeInput.focus();
      }
      setRecoveryNoticeState('err_code');
      return;
    }

    if (codeInput) {
      codeInput.classList.remove('input-invalid');
    }
    // Code verified! Now navigate to Set New Password screen
    recoveryStage = 'new_pw';
    recoveryNoticeState = 'normal';
    loadScreen('us03_recovery');
  }

  function simulateVerifyCodeFailure() {
    recoveryStage = 'code';
    loadScreen('us03_recovery');
    const codeInput = document.getElementById('recoveryCode');
    if (codeInput) {
      codeInput.value = '419208'; // wrong code
      codeInput.classList.add('input-invalid');
      codeInput.focus();
    }
    setRecoveryNoticeState('err_code');
  }

  function simulateVerifyCodeSuccess() {
    recoveryStage = 'code';
    loadScreen('us03_recovery');

  function loadScreen(screenId) {
    // Save any existing form inputs before navigating
    saveCurrentInputs();

    currentScreen = screenId;
    dismissPopup();
    dismissNotificationModal();
    
    // Update pills
    const p1 = document.getElementById('btnUS01');
    const p2 = document.getElementById('btnUS02Step1');
    const p3 = document.getElementById('btnUS02Step2');
    const p4 = document.getElementById('btnUS09FCM');
    const p5 = document.getElementById('btnUS03Recovery');
    if (p1) p1.classList.toggle('active', screenId === 'us01_signin');
    if (p2) p2.classList.toggle('active', screenId === 'us02_step1');
    if (p3) p3.classList.toggle('active', screenId === 'us02_step2');
    if (p4) p4.classList.toggle('active', screenId === 'us09_fcm');
    if (p5) p5.classList.toggle('active', screenId === 'us03_recovery');

    // Update Header
    const titleEl = document.getElementById('panelHeaderTitle');
    const subEl = document.getElementById('panelHeaderSub');
    // Top Header is removed across all screens
    const topHeaderEl = document.getElementById('topHeader');
    if (topHeaderEl) topHeaderEl.style.display = 'none';

    // Render screen inside authentic viewport
    document.getElementById('screenBody').innerHTML = screens[screenId]();

    // Update notification
    updateNotificationDisplay();

    // Render separate controller panel & criteria checklist
    renderControllerPanel();
    renderCriteria(screenId);
  }

    if (el.type === 'password') {
      el.type = 'text';
      btn.innerHTML = getEyeSlashSVG();
      btn.setAttribute('title', 'Hide password');
    } else {
      el.type = 'password';
      btn.innerHTML = getEyeSVG();
      btn.setAttribute('title', 'Show password');
    }
  }

  function simulateSignin() {
    const btn = document.getElementById('btnSubmitSignin');
    btn.innerHTML = 'Signing in...';
    btn.style.opacity = '0.85';
    setTimeout(() => {
      btn.innerHTML = 'Signed In';
      btn.style.background = '#3ED598';
      setUS01State('ok_session');
      setTimeout(() => {
        btn.innerHTML = 'Sign In';
        btn.style.background = '';
        btn.style.opacity = '1';
      }, 500);
    }, 800);
  }

  function refreshStatus() {
    alert('Application Status:\nApplication #SKYX-REG-2026-9041 is currently in Hardware Silicon Audit (Expected: 24 to 48 Hours).');
  }

  function handleDemoClick() {
    alert('Demo Mode Activated:\nIsolated simulation environment initialized with sample aircraft and flight data.\nPhysical aircraft links and arming interlocks remain disabled.');
  }

  // Viewport & Theme controls
  function setTheme(t) {
    currentTheme = t;
    const vp = document.getElementById('viewport');
    vp.className = `screen-viewport ${t === 'dark' ? 'theme-dark' : 'theme-light'} ${document.getElementById('btnPortrait').classList.contains('active') ? 'portrait-mode' : ''} ${document.getElementById('btnWide').classList.contains('active') ? 'wide-mode' : ''}`;
    
    document.getElementById('btnDark').classList.toggle('active', t === 'dark');
    document.getElementById('btnLight').classList.toggle('active', t === 'light');

    // Update top header logo if present
    const headerLogo = document.getElementById('topHeaderLogo');
    if (headerLogo) {
      const arcColor = (t === 'dark') ? '#EAF2F7' : '#071A2B';
      headerLogo.innerHTML = `
        <path d="M84.17,19.83 A45.5,45.5 0 0 1 84.17,84.17" fill="none" stroke="${arcColor}" stroke-width="13"/>
        <path d="M19.83,84.17 A45.5,45.5 0 0 1 19.83,19.83" fill="none" stroke="${arcColor}" stroke-width="13"/>
        <polygon points="52,35 69,52 52,69 35,52" fill="#00C4DE"/>
      `;
    }

    // Re-render screen to refresh SVGs & Tokens
    loadScreen(currentScreen);
  }

  function setViewport(mode) {
    const vp = document.getElementById('viewport');
    vp.classList.remove('wide-mode', 'portrait-mode');
    document.getElementById('btnStandard').classList.remove('active');
    document.getElementById('btnWide').classList.remove('active');
    document.getElementById('btnPortrait').classList.remove('active');

    if (mode === 'wide') {
      vp.classList.add('wide-mode');
      document.getElementById('btnWide').classList.add('active');
    } else if (mode === 'portrait') {
      vp.classList.add('portrait-mode');
      document.getElementById('btnPortrait').classList.add('active');
    } else {
      document.getElementById('btnStandard').classList.add('active');
    }
  }

  // Initialize from URL parameters or hash
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('theme') === 'light') {
    setTheme('light');
  }

  const hash = window.location.hash.replace('#', '');
  if (hash && screens[hash]) {
    loadScreen(hash);
  } else {
    loadScreen('us01_signin');
  }
</script>
